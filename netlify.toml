# Publish only the book itself. Drafts (docs/), tests, and tools stay in the repo.
[build]
  command = "bash tools/build.sh"
  publish = "dist"

# Unlisted until launch: ask search engines not to index anything.
# Remove this block when the book is ready to be found.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
